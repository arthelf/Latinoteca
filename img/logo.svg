<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-label="Logo da Latinoteca">
  <!-- Arco vertical (como uma porta ou janela) -->
  <path d="M10 290 V110 A90 90 0 0 1 190 110 V290 Z" fill="#1f4d3f"/>
  <path d="M24 280 V112 A76 76 0 0 1 176 112 V280 Z" fill="none" stroke="#d9a441" stroke-width="4"/>

  <!-- Sol -->
  <circle cx="100" cy="92" r="26" fill="#d9a441"/>
  <g stroke="#d9a441" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="50" x2="100" y2="40"/>
    <line x1="64" y1="64" x2="57" y2="57"/>
    <line x1="136" y1="64" x2="143" y2="57"/>
    <line x1="52" y1="92" x2="42" y2="92"/>
    <line x1="148" y1="92" x2="158" y2="92"/>
  </g>

  <!-- Livros em pé -->
  <rect x="44" y="170" width="24" height="110" rx="3" fill="#b5482a"/>
  <rect x="72" y="150" width="24" height="130" rx="3" fill="#f6efe3"/>
  <rect x="100" y="180" width="24" height="100" rx="3" fill="#d9a441"/>
  <rect x="128" y="160" width="28" height="120" rx="3" fill="#b5482a"/>
  <rect x="44" y="196" width="24" height="5" fill="#f6efe3"/>
  <rect x="72" y="172" width="24" height="5" fill="#1f4d3f"/>
  <rect x="128" y="186" width="28" height="5" fill="#f6efe3"/>

  <!-- Base -->
  <rect x="34" y="280" width="132" height="6" rx="3" fill="#f6efe3"/>
</svg>
